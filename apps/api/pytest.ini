[pytest]
asyncio_mode = auto
# One event loop for the whole session: the async engine holds pooled
# connections, and a per-test loop would leave them bound to a dead loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
# The ten thousand row import is real work; it is excluded from the default run
# and enabled with `pytest -m slow`.
addopts = -m "not slow"
markers =
    slow: writes a full sized inventory file and imports it
filterwarnings =
    ignore::DeprecationWarning
