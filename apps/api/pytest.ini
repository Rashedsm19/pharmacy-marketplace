[pytest]
asyncio_mode = auto
# One event loop for the whole session: the async engine holds pooled
# connections, and a per-test loop would leave them bound to a dead loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
